program: linear_probe_responses.py
method: bayes
run_cap: 5
metric:
  name: val_loss
  goal: minimize
parameters:
  lr:
    distribution: log_uniform_values
    min: 7e-4
    max: 1e-2
  # weight_decay:
  #   distribution: log_uniform_values
  #   min: 1e-5
  #   max: 1e-2
  l1_reg:
    distribution: log_uniform_values
    min: 5e-6
    max: 1e-3

command:
  - ${env}
  - python
  - ${program}
  - --K
  - 24
  - --ALPHA
  - "1_5"
  - --select_frac_neurons
  - 0.5
  - --predict
  - latents
  - --batch_size
  - 256
  - --reg_type
  - lasso
  - --device
  - cpu 
  - ${args}   # 👈 THIS injects: --lr <...> --weight_decay <...> --l1_reg <...> --ds_pooling <...> --batch_size <...>

